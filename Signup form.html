<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coding school signup</title>
</head>
<body>
    <form action="#" method="post">
        <fieldset>
            <legend>Candidate registration form</legend>
            <p>
                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="user_name" placeholder="Sam Jackson" required>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="user_email" placeholder="email@example.com" required>
            </p>
            <p>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="user_phone" placeholder="123-456-7890" required>
            </p>
            <p>
                <label for="bootcamp">Select bootcamp:</label>
                <select id="bootcamp" name="user_bootcamp">
                    <option value="web-dev">Web Development</option>
                    <option value="data-science">Data Science</option>
                    <option value="ux-design">UX Design</option>
                </select>
            </p>
            <button type="submit">Submit application</button>
        </fieldset>
    </form>


    
</body>
</html>
